name: Bootstrap Supabase SSR Dependencies

on:
  push:
    branches:
      - feat/supabase-ssr-auth
    paths:
      - ".github/workflows/bootstrap-supabase-deps.yml"

permissions:
  contents: write

jobs:
  lock-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supabase-ssr-auth

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact Supabase SSR dependencies and refresh lockfile
        run: npm install --workspace @pagevelope/web --save-exact @supabase/ssr@0.12.4 @supabase/supabase-js@2.111.0

      - name: Verify locked install
        run: npm ci

      - name: Commit dependency metadata
        shell: bash
        run: |
          if git diff --quiet -- apps/web/package.json package-lock.json; then
            echo "Dependency metadata already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json package-lock.json
          git commit -m "build: lock Supabase SSR dependencies"
          git push origin HEAD:feat/supabase-ssr-auth
