name: Patch Campaign Builder Hydration

on:
  push:
    branches:
      - feat/campaign-persistence
    paths:
      - ".github/workflows/patch-campaign-builder.yml"

permissions:
  contents: write

jobs:
  patch-builder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/campaign-persistence

      - name: Patch hydration initialization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/builder/page.tsx")
          text = path.read_text()

          old_state = '''  const [persistenceTarget, setPersistenceTarget] = useState<PersistenceTarget | null>(null);
          const [currentVersion, setCurrentVersion] = useState(0);
          const [hydrationState, setHydrationState] = useState<"demo" | "loading" | "ready" | "error">("demo");'''
          new_state = '''  const [persistenceTarget] = useState<PersistenceTarget | null>(() => {
            if (typeof window === "undefined") return null;
            const params = new URLSearchParams(window.location.search);
            const workspaceId = params.get("workspaceId")?.trim() || "";
            const brandId = params.get("brandId")?.trim() || "";
            const campaignId = params.get("campaignId")?.trim() || "";
            return workspaceId && brandId && campaignId ? { workspaceId, brandId, campaignId } : null;
          });
          const [currentVersion, setCurrentVersion] = useState(0);
          const [hydrationState, setHydrationState] = useState<"demo" | "loading" | "ready" | "error">(
            persistenceTarget ? "loading" : "demo",
          );'''
          if old_state not in text:
            raise SystemExit("state block not found")
          text = text.replace(old_state, new_state, 1)

          old_effect = '''  useEffect(() => {
            const params = new URLSearchParams(window.location.search);
            const workspaceId = params.get("workspaceId")?.trim() || "";
            const brandId = params.get("brandId")?.trim() || "";
            const campaignId = params.get("campaignId")?.trim() || "";

            if (!workspaceId || !brandId || !campaignId) return;

            const target = { workspaceId, brandId, campaignId };
            setPersistenceTarget(target);
            setHydrationState("loading");
            setPersistenceError("");

            const controller = new AbortController();'''
          new_effect = '''  useEffect(() => {
            if (!persistenceTarget) return;
            const { workspaceId, campaignId } = persistenceTarget;
            const controller = new AbortController();'''
          if old_effect not in text:
            raise SystemExit("effect block not found")
          text = text.replace(old_effect, new_effect, 1)

          old_tail = '''    return () => controller.abort();
          }, []);'''
          new_tail = '''    return () => controller.abort();
          }, [persistenceTarget]);'''
          if old_tail not in text:
            raise SystemExit("effect dependency block not found")
          text = text.replace(old_tail, new_tail, 1)

          path.write_text(text)
          PY

      - name: Remove temporary patch workflow
        run: rm .github/workflows/patch-campaign-builder.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/builder/page.tsx .github/workflows/patch-campaign-builder.yml
          git commit -m "fix: initialize campaign hydration without cascading effect state"
          git push origin HEAD:feat/campaign-persistence
