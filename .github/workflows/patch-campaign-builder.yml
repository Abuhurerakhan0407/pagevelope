name: Patch Campaign Builder Hydration

on:
  push:
    branches:
      - feat/campaign-persistence
    paths:
      - ".github/workflows/patch-campaign-builder.yml"

permissions:
  contents: write

jobs:
  patch-builder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/campaign-persistence

      - name: Patch hydration initialization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/builder/page.tsx")
          text = path.read_text()

          old_state = "  const [persistenceTarget, setPersistenceTarget] = useState<PersistenceTarget | null>(null);\n  const [currentVersion, setCurrentVersion] = useState(0);\n  const [hydrationState, setHydrationState] = useState<\"demo\" | \"loading\" | \"ready\" | \"error\">(\"demo\");"
          new_state = "  const [persistenceTarget] = useState<PersistenceTarget | null>(() => {\n    if (typeof window === \"undefined\") return null;\n    const params = new URLSearchParams(window.location.search);\n    const workspaceId = params.get(\"workspaceId\")?.trim() || \"\";\n    const brandId = params.get(\"brandId\")?.trim() || \"\";\n    const campaignId = params.get(\"campaignId\")?.trim() || \"\";\n    return workspaceId && brandId && campaignId ? { workspaceId, brandId, campaignId } : null;\n  });\n  const [currentVersion, setCurrentVersion] = useState(0);\n  const [hydrationState, setHydrationState] = useState<\"demo\" | \"loading\" | \"ready\" | \"error\">(\n    persistenceTarget ? \"loading\" : \"demo\",\n  );"
          if old_state not in text:
              raise SystemExit("state block not found")
          text = text.replace(old_state, new_state, 1)

          effect_start = text.index("  useEffect(() => {\n    const params = new URLSearchParams(window.location.search);")
          controller_line = "    const controller = new AbortController();"
          controller_index = text.index(controller_line, effect_start)
          new_effect_start = "  useEffect(() => {\n    if (!persistenceTarget) return;\n    const { workspaceId, campaignId } = persistenceTarget;\n    const controller = new AbortController();"
          text = text[:effect_start] + new_effect_start + text[controller_index + len(controller_line):]

          old_tail = "    return () => controller.abort();\n  }, []);"
          new_tail = "    return () => controller.abort();\n  }, [persistenceTarget]);"
          if old_tail not in text:
              raise SystemExit("effect dependency block not found")
          text = text.replace(old_tail, new_tail, 1)

          path.write_text(text)
          PY

      - name: Remove temporary patch workflow
        run: rm .github/workflows/patch-campaign-builder.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/builder/page.tsx .github/workflows/patch-campaign-builder.yml
          git commit -m "fix: initialize campaign hydration without cascading effect state"
          git push origin HEAD:feat/campaign-persistence
